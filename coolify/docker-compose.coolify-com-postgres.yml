# Opcional: stack HEZZUZ Logs + PostgreSQL no MESMO Service Coolify.
# A opcao recomendada para producao continua sendo PostgreSQL como recurso separado,
# pois facilita backup, operacao e atualizacao independente.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hezzuz_logs}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - hezzuz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB:-hezzuz_logs}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-hezzuz_logs}
      DATABASE_SSL: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      AUTH_SECRET: ${SERVICE_HEX_64_AUTHSECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      HEZZUZ_INGEST_KEYS: >-
        {"survival":"${SERVICE_HEX_64_SURVIVAL}","lobby":"${SERVICE_HEX_64_LOBBY}","skyblock":"${SERVICE_HEX_64_SKYBLOCK}"}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
      DISCORD_FORWARD_MODE: ${DISCORD_FORWARD_MODE:-critical}
      DISCORD_WEBHOOK_DEFAULT: ${DISCORD_WEBHOOK_DEFAULT:-}
      DISCORD_WEBHOOK_MODERATION: ${DISCORD_WEBHOOK_MODERATION:-}
      DISCORD_WEBHOOK_ERRORS: ${DISCORD_WEBHOOK_ERRORS:-}
      DISCORD_WEBHOOK_SERVER: ${DISCORD_WEBHOOK_SERVER:-}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  hezzuz-postgres:
